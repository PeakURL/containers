name: Containers

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: latest
      release_url:
        description: PeakURL release archive URL
        required: true
        default: https://releases.peakurl.org/latest.zip
      release_sha256:
        description: Optional SHA256 checksum for the release archive
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve Docker Hub settings
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          NAMESPACE="${DOCKERHUB_NAMESPACE:-peakurl}"
          USERNAME="${DOCKERHUB_USERNAME:-$NAMESPACE}"
          IMAGE_NAME="docker.io/${NAMESPACE}/peakurl"

          {
            echo "namespace=$NAMESPACE"
            echo "username=$USERNAME"
            echo "image_name=$IMAGE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build inputs and download release archive
        id: build
        shell: bash
        env:
          DOCKERHUB_IMAGE_NAME: ${{ steps.dockerhub.outputs.image_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ inputs.image_tag }}"
          RELEASE_URL="${{ inputs.release_url }}"
          INPUT_SHA256="${{ inputs.release_sha256 }}"

          ARCHIVE_FILENAME="peakurl-${IMAGE_TAG}.zip"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          if [ -n "$RELEASE_URL" ]; then
            ARCHIVE_KEY="$(echo "$RELEASE_URL" | sed -E 's|^https?://[^/]+/||')"
          elif [ "$IMAGE_TAG" = "latest" ]; then
            ARCHIVE_KEY="latest.zip"
          else
            ARCHIVE_KEY="package/peakurl-${IMAGE_TAG}.zip"
          fi

          echo "Downloading archive from R2: s3://${R2_BUCKET}/${ARCHIVE_KEY} -> ${ARCHIVE_FILENAME}"
          aws s3 cp "s3://${R2_BUCKET}/${ARCHIVE_KEY}" "$ARCHIVE_FILENAME" --endpoint-url "$R2_ENDPOINT"

          COMPUTED_SHA256="$(sha256sum "$ARCHIVE_FILENAME" | awk '{print $1}')"

          if [ -n "$INPUT_SHA256" ] && [ "$INPUT_SHA256" != "$COMPUTED_SHA256" ]; then
            echo "SHA256 mismatch for ${ARCHIVE_FILENAME}!" >&2
            echo "Expected: $INPUT_SHA256" >&2
            echo "Computed: $COMPUTED_SHA256" >&2
            exit 1
          fi

          RELEASE_SHA256="$COMPUTED_SHA256"
          echo "Verified release archive ${ARCHIVE_FILENAME} (SHA-256: ${RELEASE_SHA256})"

          TAG_ALIASES="$IMAGE_TAG"
          if [[ "$IMAGE_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            TAG_ALIASES="$IMAGE_TAG"$'\n'"${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"$'\n'"${BASH_REMATCH[1]}"$'\nlatest'
          fi

          REGISTRY_TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            REGISTRY_TAGS="${REGISTRY_TAGS}${DOCKERHUB_IMAGE_NAME}:$tag"$'\n'
          done < <(printf '%s\n' "$TAG_ALIASES")

          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          {
            echo "image_tag=$IMAGE_TAG"
            echo "archive_file=$ARCHIVE_FILENAME"
            echo "release_sha256=$RELEASE_SHA256"
            echo "build_date=$BUILD_DATE"
            echo "tag_aliases<<EOF"
            echo "$TAG_ALIASES"
            echo "EOF"
            echo "registry_tags<<EOF"
            echo "$REGISTRY_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/peakurl/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.build.outputs.registry_tags }}
          cache-from: type=gha,scope=peakurl-image
          cache-to: type=gha,mode=max,scope=peakurl-image
          build-args: |
            PEAKURL_VERSION=${{ steps.build.outputs.image_tag }}
            PEAKURL_ARCHIVE_FILE=${{ steps.build.outputs.archive_file }}
            PEAKURL_RELEASE_SHA256=${{ steps.build.outputs.release_sha256 }}
